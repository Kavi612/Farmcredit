seed: 42
binary_threshold: 0.5

paths:
  train_csv: data/processed/train.csv
  val_csv: data/processed/val.csv
  test_csv: data/processed/test.csv
  model_dir: ml/artifacts/model
  reports_dir: ml/artifacts/reports

feature_columns:
  - state
  - district
  - crop_type
  - season
  - land_size_ha
  - soil_type
  - rainfall_mm
  - irrigation_type
  - loan_amount_inr
  - prior_loan_count
  - prior_default_flag
  - repayment_score
  - annual_income_inr
  - existing_debt_inr

categorical_columns:
  - state
  - district
  - crop_type
  - season
  - soil_type
  - irrigation_type

target_column: default_risk

risk_bands:
  Low: 0.25
  Medium: 0.50
  High: 0.75

xgb:
  n_estimators: 400
  learning_rate: 0.05
  max_depth: 5
  min_child_weight: 8
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  reg_alpha: 0.0
  objective: reg:squarederror
  early_stopping_rounds: 40
