<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmCredit AI</title>
  <style>
    :root {
      --green: #15803d;
      --green-dark: #14532d;
      --bg: #f0fdf4;
      --text: #1a2e1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Georgia, serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, #bbf7d0 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #d9f99d 0%, transparent 50%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main { max-width: 36rem; width: 100%; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 2.75rem);
      color: var(--green-dark);
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 1.5rem; line-height: 1.55; opacity: 0.9; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a.btn {
      display: inline-block;
      padding: 0.8rem 1.35rem;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
    }
    a.btn.secondary {
      background: transparent;
      color: var(--green);
      border: 1.5px solid var(--green);
    }
    a.btn:hover { filter: brightness(1.05); }
    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      opacity: 0.65;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <h1>FarmCredit AI</h1>
    <p>
      AI-powered crop loan default prediction and agricultural advisory for Indian farmers.
      Portfolio demo — synthetic data only.
    </p>
    <div class="actions">
      <!-- Replace these URLs after Streamlit + Render are live -->
      <a class="btn" href="https://share.streamlit.io">Open live demo</a>
      <a class="btn secondary" href="https://farmcredit-api.onrender.com/docs">API docs</a>
    </div>
    <footer>Backend: Render · UI: Streamlit Cloud · This page: Vercel</footer>
  </main>
</body>
</html>
